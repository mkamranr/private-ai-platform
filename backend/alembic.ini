; Alembic configuration.
;
; No sqlalchemy.url here on purpose — the DSN is assembled from settings in
; alembic/env.py so credentials never land in a committed file (§25, Rule 5).

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

; Timestamped, descriptive revision filenames. With one migration per module across
; 28 modules, `a1b2c3d4.py` filenames become unnavigable fast.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

; Format generated migrations. `exec` invokes the binary directly;
; `console_scripts` looks for a setuptools entry point, which ruff does not expose.
[post_write_hooks]
hooks = ruff_format,ruff_fix
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
