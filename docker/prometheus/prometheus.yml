# Prometheus scrape configuration (M19, Phase 7).
#
# Static targets, not service discovery. The platform's own services are named in the
# compose file and resolved by Docker's embedded DNS; a discovery mechanism would add a
# moving part that can only fail, on a network where the set of services is fixed and
# known at install time.
#
# Nothing here reaches outside the `ai-platform` network. There is no remote_write, no
# alertmanager on the internet, and no exporter that phones home (Rule 4).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    # Distinguishes one site's data from another's if two sites' metrics are ever
    # examined together — during a support case, typically, which is exactly when
    # unlabelled series get confused for each other.
    platform: ai-platform

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # The control plane. `/metrics` is unauthenticated and reachable only from inside this
  # network — nginx serves it a 404 — so no credential is configured here, and adding
  # one would mean putting a platform token in a config file that has no way to rotate it.
  - job_name: ai-platform-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  # Prometheus's own health. Cheap, and the first thing to check when a dashboard is
  # empty: a Prometheus that cannot scrape itself is not a platform problem.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
