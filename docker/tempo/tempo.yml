# Tempo (M19, Phase 7) — single-binary, filesystem storage.
#
# Same reasoning as Loki: one host, local disk, no object store. Tempo needs no index —
# it looks traces up by id — which is what makes the single-binary deployment genuinely
# viable rather than a compromise.

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        # HTTP only. The backend exports over OTLP/HTTP (see app/core/tracing.py) and a
        # gRPC listener nothing connects to is an open port with no purpose.
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # Flush sooner than the default. On a platform with modest trace volume, the default
  # keeps traces in memory long enough that an operator looking for the request they
  # just made cannot find it, which reads as "tracing is broken".
  max_block_duration: 5m

compactor:
  compaction:
    # 14 days. Shorter than Loki's log retention on purpose: spans are far larger per
    # unit of insight, and a trace older than a fortnight is nearly always answered
    # better by the platform's own run record, which does not expire.
    block_retention: 336h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false  # Rule 4, stated rather than assumed
