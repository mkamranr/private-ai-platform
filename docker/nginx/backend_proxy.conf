# Shared proxy settings for both API roots (/api/ and /v1/).
#
# Included rather than duplicated: these two locations must behave identically, and the
# streaming directives below are the ones that break silently when they drift.

# Via a variable, so nginx re-resolves per request rather than caching the address a
# recreated container no longer has. See the resolver note in nginx.conf.
set $platform_backend backend:8000;
proxy_pass http://$platform_backend;
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Reuse an inbound correlation id when present so a trace spans nginx, gateway, worker
# and node agent; otherwise the backend mints one.
proxy_set_header X-Request-ID      $http_x_request_id;

# --- streaming (§25: the gateway must not buffer LLM responses) ---
# Without these, nginx accumulates the whole SSE stream and releases it at the end, so a
# user watching a chat response sees nothing for 30 seconds and then everything at once.
# This is the most commonly missed part of making streaming actually work end to end.
proxy_buffering off;
proxy_request_buffering off;
proxy_cache off;
chunked_transfer_encoding on;
# Long reads: a 30B model's first token can take a while under load.
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_connect_timeout 30s;
