# Proxy settings for Open WebUI (M17).
#
# Separate from backend_proxy.conf because the requirements genuinely differ: this one
# needs a WebSocket upgrade and does not need the platform's request-id convention.

set $platform_chat open-webui:8080;
proxy_pass http://$platform_chat;
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# socket.io. `$connection_upgrade` maps to "close" for ordinary requests, so this is
# safe on every route rather than needing a separate location for /ws.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Chat responses stream token by token; buffering here would hold the whole answer and
# release it at once, which looks exactly like the model being slow.
proxy_buffering off;
proxy_request_buffering off;
proxy_cache off;

# Long reads: a large model's first token can take a while under load, and an idle
# WebSocket must not be culled mid-conversation.
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_connect_timeout 30s;
