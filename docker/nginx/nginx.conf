# Private AI Platform — edge proxy (§14).
#
# The single published entrypoint. Everything else lives on the internal network.
#
# Phase 0 terminates plain HTTP; TLS with a platform-generated CA arrives in
# Phase 1 alongside node-agent mTLS (an air-gapped site cannot use a public CA).
#
# TWO SITES, ONE PORT. Routed by name, not by path:
#
#   ai-platform.local        admin console + both API roots
#   chat.ai-platform.local   Open WebUI
#
# Path routing is not an option: Open WebUI's built assets are absolute (`/static/…`),
# so it can only be served from a site root. Giving it a name rather than a second
# published port keeps §14's "only nginx is exposed" intact. Port 8081 below is the
# developer convenience — the listener always exists, but only docker-compose.dev.yml
# publishes it, so production still exposes exactly one port.

# Docker's embedded DNS. Needed because the proxy targets below are resolved at
# *request* time, not at config load.
#
# This is not a micro-optimisation, it is a correctness fix. nginx resolves a name in an
# `upstream` block once, at startup, and caches the address forever. Recreating the
# backend container — which `docker compose up -d --build backend` does on every deploy —
# gives it a new address, and nginx keeps proxying to the old one. The platform then
# serves its admin UI perfectly while every API call fails, which is a genuinely
# confusing failure to debug.
#
# The cost of runtime resolution is losing upstream keepalive, since a variable
# `proxy_pass` cannot reference an upstream block. On an internal network that is one TCP
# handshake per request, which is a price worth paying to make redeploys survivable.
resolver 127.0.0.11 valid=10s ipv6=off;

# Open WebUI uses socket.io. Without an Upgrade/Connection pair the handshake falls back
# to long-polling, which mostly works and then intermittently does not — the worst kind
# of broken.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    # Never advertise the nginx version.
    server_tokens off;

    # Model weights, documents and offline bundles are large; 0 disables the cap
    # for uploads that legitimately run to gigabytes (M15, M23).
    client_max_body_size 0;

    # Proxy's own liveness. Deliberately independent of the backend: if this
    # reported backend health, a busy API would make Docker restart the proxy and
    # take the whole platform's entrypoint down with it.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Two API roots, on purpose (see backend/app/api/v1/gateway.py):
    #   /api/ — the platform's own API, for operators holding a JWT
    #   /v1/  — the OpenAI-compatible surface, for applications holding an API key
    #
    # Both proxy identically, so the settings live in one included file rather than
    # being duplicated and left to drift. Getting proxy_buffering wrong on only one of
    # them would produce streaming that passes a curl test and hangs for real users.
    location /api/ {
        include /etc/nginx/backend_proxy.conf;
    }

    # The voice WebSocket (M29). Its own location because an upgrade needs the Upgrade
    # and Connection headers, and a long read timeout: a voice session is mostly silence,
    # and the default 60s would drop a conversation between one question and the next.
    location /ws/ {
        set $platform_ws backend:8000;
        proxy_pass http://$platform_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Audio frames must not be held back waiting for a buffer to fill.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /v1/ {
        include /etc/nginx/backend_proxy.conf;
    }

    # The Prometheus scrape endpoint is NOT proxied. It is unauthenticated by design —
    # a scraper holds no JWT — so the network is what keeps it private, and Prometheus
    # reaches it directly at backend:8000 from inside the ai-platform network.
    #
    # Returned explicitly rather than left to fall through to the static root below:
    # a future change to `location /` would otherwise expose the platform's internals
    # without anyone noticing, and a 404 here is a decision rather than an accident.
    location = /metrics {
        access_log off;
        return 404;
    }

    # Grafana (M19), under a path so the platform still publishes exactly one port.
    # Grafana supports this properly — GF_SERVER_SERVE_FROM_SUB_PATH makes it build every
    # asset URL under /grafana/ — which is why it can live here and Langfuse cannot.
    #
    # Via a variable, like every other upstream in this file. A literal `proxy_pass
    # http://grafana:3000` is resolved at CONFIG LOAD, so with the monitoring profile
    # stopped nginx refuses to start at all: the whole platform becomes unreachable
    # because an optional service is absent. The Phase 8 gate catches exactly this.
    location /grafana/ {
        set $platform_grafana grafana:3000;
        # No URI part after the variable, so the full path including /grafana/ is passed
        # through — which is what SERVE_FROM_SUB_PATH expects.
        proxy_pass http://$platform_grafana;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grafana Live pushes dashboard updates over a websocket.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Interactive API docs (disabled by the app itself in production).
    location ~ ^/(docs|redoc|openapi\.json)$ {
        include /etc/nginx/backend_proxy.conf;
    }

    # Static admin UI (M21). Vendored Bootstrap and Chart.js are served from here —
    # an air-gapped host has no CDN, so nothing is fetched externally (Rule 4).
    location / {
        root /usr/share/nginx/html/ui/admin;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # The voice assistant (M29). Its own path, like the developer portal, and for the
    # same reason: it calls /api/v1 and opens a WebSocket on this origin, so being
    # same-origin means no CORS configuration has to exist for it to work.
    #
    # Declared before `location /` would match it — nginx prefix matching takes the
    # longest match, so without this the admin console's catch-all serves it.
    location /voice/ {
        alias /usr/share/nginx/html/ui/voice/;
        index index.html;
        try_files $uri $uri/ /voice/index.html;
    }

    # Developer portal (M20). Its own path rather than its own hostname: a developer
    # needs the same origin as the API they are about to call, so the portal's fetches
    # are same-origin and no CORS configuration has to exist for it to work.
    #
    # Declared before `location /` would match, because nginx prefix matching takes the
    # longest match — without this the admin console's catch-all would serve it.
    location /developer/ {
        alias /usr/share/nginx/html/ui/developer/;
        index index.html;
        try_files $uri $uri/ /developer/index.html;
    }

    # Vendored assets are immutable (version-pinned files), so they cache hard.
    location /vendor/ {
        root /usr/share/nginx/html/ui/admin;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# --- Chat (M17) -------------------------------------------------------------
# Open WebUI, by name on port 80 and unconditionally on 8081. The 8081 listener exists
# so a developer machine with no DNS entry can still open the chat UI; production
# publishes only port 80, so it is unreachable there.
server {
    listen 80;
    listen 8081;
    server_name chat.* chat;

    server_tokens off;
    client_max_body_size 0;

    location / {
        include /etc/nginx/chat_proxy.conf;
    }
}

# --- Langfuse (M19) ---------------------------------------------------------
# By name, not under a path, for exactly the reason Open WebUI is: it is a Next.js
# application whose asset URLs are absolute (`/_next/...`), and Next.js fixes its base
# path at build time. Serving it under /langfuse/ returns a working API and a blank page.
#
# Port 8082 is the developer convenience, mirroring chat on 8081: production publishes
# only port 80 and routes by name, so this listener is unreachable there.
server {
    listen 80;
    listen 8082;
    server_name langfuse.* langfuse;

    server_tokens off;
    client_max_body_size 0;

    location / {
        set $platform_langfuse langfuse:3000;
        proxy_pass http://$platform_langfuse;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
