# GENERATED by scripts/vendor_mcp_servers.py — do not edit.
#
# One service per MCP server manifest. Each runs the stdio→HTTP bridge with its
# server's package already vendored into the image, so nothing is fetched at
# runtime (Rule 4).
#
#   make mcp          start them
#   make mcp-import   register and discover them in the platform

services:
  mcp-filesystem:
    image: ai-platform/mcp-filesystem:0.1.0
    profiles: [agents]
    restart: unless-stopped
    networks: [ai-platform]
    # No ports: reached only by the control plane over the internal network.
    volumes:
      - "${PLATFORM_DATA_ROOT:-./data}/shared:/data/shared:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

