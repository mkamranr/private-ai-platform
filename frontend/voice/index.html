<!--
  AI Assistant — the voice-first surface (M29 §33).

  Deliberately not a chat window with a microphone bolted on (§54). The avatar is the
  page; the transcript is a record beside it, and there is no text input at all — adding
  one would make speech the fallback rather than the point.

  **There are no settings on this page.** An earlier version put the agent and the spoken
  language in dropdowns above the avatar, which is a form asking somebody to configure a
  conversation before having one. Both already have a site default the server applies, and
  the language default is auto-detect — so the choice was busywork that also offered a
  wrong answer. What remains is one control, the microphone, plus a switch for how the
  assistant is drawn, which is a view preference rather than a setting.

  No build step, matching the rest of this frontend: ES modules straight from disk, and
  a vendored Three.js, so an air-gapped host serves it from the bundle with no toolchain.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Assistant</title>
<link rel="stylesheet" href="css/voice.css">

<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>AI Assistant</div>

    <!-- Which agent is answering, shown rather than asked. The dot carries the state, so
         it stays legible from across a desk when the caption is not. -->
    <div id="agent-chip" class="chip d-none" data-state="idle">
      <span class="dot" aria-hidden="true"></span>
      <span id="agent-name">Assistant</span>
    </div>

    <div class="segmented" role="group" aria-label="Avatar style">
      <button type="button" class="seg" data-theme="neural" aria-pressed="true" title="Neural face">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M12 3c4 0 6.5 3 6.5 7.5S16 21 12 21s-6.5-5-6.5-10.5S8 3 12 3Z"/>
          <path d="M9 10h.01M15 10h.01M9.5 15c1.6 1 3.4 1 5 0"/>
        </svg>
        <span class="sr-only">Neural face</span>
      </button>
      <button type="button" class="seg" data-theme="waveform" aria-pressed="false" title="Waveform">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M2 12h3l2.5-6 3 13 3-9 2 4h6.5"/>
        </svg>
        <span class="sr-only">Waveform</span>
      </button>
    </div>

    <a class="back" href="/">Admin console</a>
  </header>

  <!-- Sign-in gate. Hidden when a session token is already in sessionStorage, so
       arriving from the admin console does not ask again. -->
  <section id="gate" class="gate d-none">
    <form id="signin-form" class="gate-card">
      <div class="gate-mark" aria-hidden="true"></div>
      <h1>AI Assistant</h1>
      <p class="muted">Sign in with your platform account.</p>
      <label for="username">Username</label>
      <input id="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Enter</button>
    </form>
  </section>

  <main id="stage" class="stage d-none">
    <!-- The avatar fills its column and everything else floats over it, so the page reads
         as one surface rather than as a stack of strips. -->
    <section class="viewport">
      <canvas id="hologram" aria-hidden="true"></canvas>

      <div class="overlay">
        <div id="tools" class="tools"></div>
        <div id="caption" class="caption caption-idle">Ready</div>
        <div id="partial" class="partial"></div>
      </div>
    </section>

    <!-- Outside the viewport on purpose. Overlaid on the avatar the microphone lands on
         its chin, and the one control on the page should not be sitting on the face. -->
    <div class="dock">
      <button id="mic" class="mic" aria-label="Hold to speak">
        <span class="mic-ring" aria-hidden="true"></span>
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
          <path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3z"/>
          <path fill="currentColor" d="M19 12a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V23h2v-2.06A9 9 0 0 0 21 12z"/>
        </svg>
      </button>
      <p class="hint">Hold to speak — or hold <kbd>Space</kbd></p>
    </div>

    <aside class="panel">
      <h2 class="panel-head">Transcript</h2>
      <div id="transcript" class="transcript" aria-live="polite"></div>
      <p id="transcript-empty" class="empty">
        Nothing said yet.<br>Hold the microphone and start talking.
      </p>
    </aside>
  </main>

  <div id="error" class="error d-none" role="alert"></div>
</div>

<script type="module" src="js/voice.js"></script>
