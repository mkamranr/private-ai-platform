# Reference manifest: the official filesystem MCP server.
#
# Mounted read-only. An MCP server the agents can reach is, in effect, a capability granted
# to every agent that is later given its tools — a writable mount would let a
# prompt-injected instruction modify files on a shared volume.
name: filesystem
display_name: Filesystem
description: >
  Read, list and search files beneath a shared directory. Useful for agents that answer
  from documents an operator has placed on disk rather than ingested into a knowledge base.
npm: "@modelcontextprotocol/server-filesystem@2025.8.21"
command: >
  node /vendor/lib/node_modules/@modelcontextprotocol/server-filesystem/dist/index.js
  /data/shared
volumes:
  - "${PLATFORM_DATA_ROOT:-./data}/shared:/data/shared:ro"
category: files
network: none
writes: false
source: https://github.com/modelcontextprotocol/servers (MIT)
# Hints for the reviewer; applied only when an administrator chooses to, and never enables
# a tool. The write tools are CRITICAL even though the mount is read-only: if someone later
# mounts it writable, the suggestion should already be the cautious one.
suggested_risk:
  read_file: LOW
  read_text_file: LOW
  read_media_file: LOW
  read_multiple_files: LOW
  list_directory: LOW
  list_directory_with_sizes: LOW
  directory_tree: LOW
  search_files: LOW
  get_file_info: LOW
  list_allowed_directories: LOW
  create_directory: HIGH
  write_file: CRITICAL
  edit_file: CRITICAL
  move_file: CRITICAL
